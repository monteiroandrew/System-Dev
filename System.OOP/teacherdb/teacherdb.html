<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendify - Teacher Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="teacher-dashboard-body">

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <span class="brand-name">Attendify</span>
    </div>

    <div class="user-nav">
      <div class="philippine-clock" aria-label="Philippine time">
        <span>PH TIME</span>
        <time id="philippine-time">--:--:--</time>
        <time id="philippine-date">---</time>
      </div>
      <div class="user-info">
        <span class="user-display-name" id="nav-user-name">Teacher</span>
        <span class="user-role-badge">Teacher</span>
      </div>
      <div class="user-avatar" id="user-avatar">TC</div>
      <button class="btn-signout" id="btn-signout">Sign out</button>
    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="dashboard-container">
    <!-- Greeting Header -->
    <div class="dashboard-header">
      <div>
        <p class="section-tag">Teacher dashboard</p>
        <h1>Good morning, <span id="dash-first-name">Teacher</span>.</h1>
        <p class="subtitle">Choose a section to view and manage its attendance.</p>
      </div>
      <a href="createsec.html" class="btn-create-section" id="btn-create-section" style="text-decoration: none;">
        <i class="fa-solid fa-plus"></i> Create section
      </a>
    </div>

    <!-- My Sections Header -->
    <div class="sections-toolbar">
      <div>
        <h3>My sections</h3>
        <p class="subtitle-sm"><span id="active-classes-count">0</span> active sections</p>
      </div>
      <a href="#" class="view-archive-link">View archive</a>
    </div>

    <!-- Folder-Style Section Cards Grid -->
    <div class="sections-grid" id="sections-grid"></div>

  </main>

  <script src="../script.js"></script>
</body>
</html>
